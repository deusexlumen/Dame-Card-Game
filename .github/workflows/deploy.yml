name: Deploy to GitHub Pages

# Archiviert (2026-10-20): DAME lebt in deusexlumen/latte-app.
# Pages zeigt nur noch eine Weiterleitung zur Latte-App, damit alte Links funktionieren.
on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/workflows/deploy.yml', 'pages-redirect/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-redirect

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
