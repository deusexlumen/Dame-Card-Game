<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#00cc33"/>
    </linearGradient>
  </defs>

  <!-- Terminal-black background -->
  <rect width="512" height="512" fill="#0a0f0a"/>

  <!-- Subtle phosphor scanlines -->
  <g opacity="0.06">
    <rect y="32" width="512" height="2" fill="#00ff41"/>
    <rect y="96" width="512" height="2" fill="#00ff41"/>
    <rect y="160" width="512" height="2" fill="#00ff41"/>
    <rect y="224" width="512" height="2" fill="#00ff41"/>
    <rect y="288" width="512" height="2" fill="#00ff41"/>
    <rect y="352" width="512" height="2" fill="#00ff41"/>
    <rect y="416" width="512" height="2" fill="#00ff41"/>
    <rect y="480" width="512" height="2" fill="#00ff41"/>
  </g>

  <!-- Playing-card outline -->
  <rect x="80" y="80" width="352" height="352" rx="44" ry="44"
        fill="none" stroke="url(#glow)" stroke-width="18"/>

  <!-- Bold "D" monogram, path-based for consistent rendering -->
  <path d="M154 134 h82
           c44 0 74 26 94 60
           c20 34 28 78 28 122
           c0 44 -8 88 -28 122
           c-20 34 -50 60 -94 60
           h-82 z
           M208 184 v44
           c32 0 50 20 62 48
           c12 28 14 62 2 92
           c-8 20 -26 38 -58 38
           h-8 z"
        fill="#00ff41"/>

  <!-- Corner pips -->
  <circle cx="124" cy="124" r="14" fill="#00ff41"/>
  <circle cx="388" cy="388" r="14" fill="#00ff41"/>
</svg>
